ng><output id="dash-time" for="dash-time-slider"></output><input id="dash-date" type="date" hidden></div><div class="dash-timeline"><input id="dash-time-slider" type="range" min="0" step="1" aria-label="選擇浮油量測日期與時間"><div><span id="dash-time-start"></span><span id="dash-time-end"></span></div></div><div class="dash-oil-summary" id="dash-oil-summary"></div><div class="dash-oil-cards" id="dash-oil-cards"></div><div class="dash-oil-selected" id="dash-oil-selected"></div></section></div></main><footer class="site-footer">預設點位與數值均為虛構示範；你在瀏覽器上傳的 Excel 不會寫入 GitHub。土壤 TPH 管制標準 1,000 mg/kg；僅用實驗室分析值判斷超標。原始 SND 表示低於 200 mg/kg，與有明確數字的結果分開顯示。<a href="https://oaout.moenv.gov.tw/Law/LawContent.aspx?id=FL015523" target="_blank" rel="noopener">環境部土壤污染管制標準</a></footer><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="site-data.js"></script><script src="excel-upload.js"></script><script src="dashboard.js"></script></body></html>

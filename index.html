<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>環境場址調查成果平台</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/lnapl.css"><link rel="stylesheet" href="css/excel-import.css"><link rel="stylesheet" href="css/data-editor.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/professional-ui.css?v=208e95c3"></head><body><header><h1>環境場址調查成果平台 <small style="font-size:12px;font-weight:600;color:#607078;white-space:nowrap">commit 86dcd7f5</small></h1><p id="site-description">互動式查看場址調查點位、採樣深度與分析結果</p><details class="excel-tools-panel"><summary>Excel / DEM 資料管理</summary><div class="excel-tools-body"><div class="excel-import-bar"><label class="excel-file-button" for="excel-file">選擇 Excel</label><input id="excel-file" type="file" accept=".xlsx,.xls" hidden><span id="excel-file-name">尚未選擇檔案</span><button id="excel-preview-button" type="button" disabled>檢查資料</button><button id="excel-apply-button" type="button" disabled>套用更新</button></div><div id="excel-import-status" class="excel-import-status">先匯入調查 Excel，再視需要套用 DEM 高程。</div><div class="excel-import-bar dem-import-bar"><label class="excel-file-button" for="dem-file">選擇 DEM GeoTIFF</label><input id="dem-file" type="file" accept=".tif,.tiff,image/tiff" hidden><span id="dem-file-name">尚未選擇 DEM</span><button id="dem-apply" type="button" disabled>套用 DEM 高程</button></div><div id="dem-status" class="dem-status">支援 TWD97 / TM2 zone 121（EPSG:3826）GeoTIFF；依 Excel 的 TWD97 X/Y 取得 EL。</div><details id="data-editor" class="data-editor" hidden><summary>線上資料編輯器</summary><div class="data-editor-body"><div class="editor-toolbar"><button id="editor-apply" type="button" disabled>套用到畫面</button><button id="editor-download" class="secondary" type="button" disabled>下載目前資料 XLSX</button></div><div id="editor-tabs" class="editor-tabs"></div><div id="editor-table-wrap" class="editor-table-wrap"></div><div id="editor-status"></div></div></details></div></details></header><main class="viewer"><section class="map-panel"><h2>場址調查平面圖</h2><div id="map"></div></section><aside class="info-panel"><div id="empty-state"><h2>調查點資料</h2><p>請點選左側地圖上的調查點。</p></div><div id="point-detail" class="hidden"><h2 id="point-id"></h2><p id="point-type"></p><div id="sample-results"></div></div></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script><script src="js/app.js?v=c2223181"></script><script src="js/lnapl.js?v=7cbf482a"></script><script src="js/excel-import.js?v=fb69a17e"></script><script src="js/data-editor.js?v=32022dd9"></script><script src="js/professional-ui.js?v=86dcd7f5"></script><script src="js/dem-import.js?v=ffb85c90"></script></body></html>

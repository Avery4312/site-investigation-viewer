<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>環境場址調查成果平台</title>

    <!-- Leaflet 地圖樣式 -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>環境場址調查成果平台</h1>
        <p id="site-description">
            互動式查看場址調查點位、採樣深度與分析結果
        </p>
    </header>

    <main class="viewer">

        <!-- 左側：場址地圖 -->
        <section class="map-panel">
            <h2>場址調查平面圖</h2>
            <div id="map"></div>
        </section>

        <!-- 右側：調查結果 -->
        <aside class="info-panel">

            <div id="empty-state">
                <h2>調查點資料</h2>
                <p>請點選左側地圖上的調查點。</p>
            </div>

            <div id="point-detail" class="hidden">

                <h2 id="point-id"></h2>

                <p id="point-type"></p>

                <div id="sample-results"></div>

            </div>

        </aside>

    </main>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 自訂程式 -->
    <script src="js/app.js"></script>

</body>

</html>
